<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<title>Groovebox</title>
<style>
:root{--bg:#0f1115;--p1:#161920;--p2:#1f232b;--p3:#292e38;--ln:#2a2f39;--tx:#e9ebf0;--dim:#838a97;--red:#ff4757;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transform:scale(.985);pointer-events:none;transition:opacity .4s var(--ease),transform .4s var(--ease);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.show{opacity:1;transform:none;pointer-events:auto}
.chip{height:28px;padding:0 11px;border-radius:14px;background:var(--p2);border:1px solid var(--ln);font:700 12px system-ui;display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;transition:background .2s,opacity .2s,border-color .2s,transform .15s}
.chip:active,.ib:active{transform:scale(.94)}
.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
.chip svg{width:14px;height:14px}
.ib{width:34px;height:30px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--dim);transition:opacity .2s,transform .15s}
.ib svg{width:17px;height:17px}
.ib.off{opacity:.3;pointer-events:none}
.ib.undo{width:auto;padding:0 11px;gap:6px;color:var(--tx);background:var(--p2);border:1px solid var(--ln);font:700 12px system-ui}
.ib.undo svg{width:15px;height:15px}

/* ---------- Start ---------- */
#start{align-items:center;justify-content:center;gap:28px}
#start h1{font:200 clamp(26px,9vw,44px) system-ui;letter-spacing:clamp(3px,1.6vw,8px);margin:0;text-align:center}
#start h1 b{font-weight:800;color:var(--red)}
#start p{margin:-18px 0 0;color:var(--dim);letter-spacing:1px;text-align:center}
.srow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.big{height:54px;min-width:min(230px,80vw);padding:0 26px;border-radius:27px;font:700 15px system-ui;border:1px solid var(--ln);background:var(--p2);transition:transform .15s,background .2s}
.big:active{transform:scale(.96)}
.big.pri{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- Projekt / Spuren ---------- */
#top{height:38px;display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;flex:0 0 auto}
#pname{font:700 13px system-ui;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.3px}
#tv{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#ruler{position:absolute;left:62px;right:0;top:0;height:36px;overflow:hidden;background:var(--p1);border-bottom:1px solid var(--ln);border-top:1px solid var(--ln)}
#rulerIn{position:absolute;top:0;left:0;height:100%;will-change:transform}
.rn{position:absolute;bottom:3px;height:13px;line-height:13px;font:600 10px ui-monospace,Menlo,monospace;color:var(--dim);padding-left:4px;border-left:1px solid #3a404c}
#corner{position:absolute;left:0;top:0;width:62px;height:36px;background:var(--p1);border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
#heads{position:absolute;left:0;top:36px;bottom:0;width:62px;overflow:hidden;z-index:3;background:var(--bg)}
#lanes{position:absolute;left:62px;right:0;top:36px;bottom:0;overflow:hidden}
#headsIn,#lanesIn{position:absolute;left:0;top:0;will-change:transform}
#headsIn{width:62px}
.lane{position:absolute;left:0;right:0;border-bottom:1px solid var(--ln);transition:background .3s}
.lane.sel{background:rgba(255,255,255,.035)}
.lane .hint{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#5c6370;font:600 12px system-ui;white-space:nowrap;pointer-events:none}
.head{position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--ln);width:62px}
.slot{width:48px;height:calc(100% - 10px);border-radius:10px;background:var(--p2);border:1px solid var(--ln);border-left:3px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;transition:transform .2s var(--ease),box-shadow .3s,opacity .3s;overflow:hidden;padding:0 2px}
.slot b{font:800 10.5px system-ui;letter-spacing:.4px;color:var(--c)}
.slot i{font:600 8.5px system-ui;color:var(--dim);font-style:normal;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty{border:1.5px dashed #464d5b;color:var(--dim);font:300 22px system-ui}
.slot.mute{opacity:.45}
.slot:active{transform:scale(.92)}
.head.sel .slot{box-shadow:0 0 0 2px rgba(255,255,255,.22)}
.head.fx .slot{width:38px;margin-left:16px;border-radius:8px}
.head.fx .slot b{font-size:9px;letter-spacing:0}
.head.fx::before{content:'';position:absolute;left:9px;top:-1px;height:calc(50% + 1px);width:9px;border-left:1.5px solid #464d5b;border-bottom:1.5px solid #464d5b;border-bottom-left-radius:7px}
.head.fx.orphan .slot{opacity:.45}
.addh{border-bottom:0}
.tdel{position:absolute;top:1px;right:-1px;width:18px;height:18px;border-radius:10px;background:var(--p3);border:1px solid var(--ln);color:var(--dim);font:700 9px/1 system-ui;display:flex;align-items:center;justify-content:center;z-index:2;transition:background .2s,color .2s}
.tdel::after{content:'';position:absolute;inset:-2px}
.tdel:active{background:var(--red);color:#fff}
.head.tlift,.lane.tlift{z-index:8;background:#1a1d24;box-shadow:0 10px 28px rgba(0,0,0,.65);transition:box-shadow .2s;opacity:.97}
.head.tlift .slot{transform:scale(1.05)}
.dropln{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--red);box-shadow:0 0 8px rgba(255,71,87,.7);z-index:7;pointer-events:none;transition:top .12s var(--ease)}
#addTrack{width:36px;height:36px;border-radius:18px;border:1.5px solid var(--ln);background:var(--p1);font:300 24px/1 system-ui;color:var(--dim);transition:transform .2s var(--ease),background .2s}
#addTrack:active{transform:scale(.9);background:var(--p3)}
.head.pop,.lane.pop{animation:rowin .45s var(--ease)}
@keyframes rowin{from{opacity:0;transform:translateY(-10px)}}

.clip{position:absolute;top:3px;bottom:3px;border-radius:7px;background:color-mix(in srgb,var(--c) 20%,#14171d);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);transition:box-shadow .2s,opacity .2s,transform .2s var(--ease)}
.clip::before{content:'';position:absolute;left:0;right:0;top:0;height:11px;background:color-mix(in srgb,var(--c) 40%,transparent);border-radius:6px 6px 0 0;pointer-events:none}
.clip canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.clip.sel{border-color:#fff;box-shadow:0 0 0 1px #fff,0 4px 16px rgba(0,0,0,.45);z-index:2}
.clip.lift{transform:scale(1.04);box-shadow:0 12px 30px rgba(0,0,0,.6);z-index:5;opacity:.93;transition:transform .2s var(--ease),box-shadow .2s}
.clip.pop{animation:pop .38s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.86)}}
.clip.bye{opacity:0;transform:scaleY(.5);transition:opacity .2s,transform .2s}
.clip.flash::after{content:'';position:absolute;inset:0;border-radius:7px;background:#fff;animation:flash .6s forwards;pointer-events:none}
@keyframes flash{from{opacity:.6}to{opacity:0}}
.eL,.eR{position:absolute;top:0;bottom:0;width:22px;display:none;z-index:3}
.eL{left:-9px}.eR{right:-9px}
.eL::after,.eR::after{content:'';position:absolute;top:28%;bottom:28%;left:9px;width:4px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
.clip.sel .eL,.clip.sel .eR{display:block}
.cx{position:absolute;top:1px;right:14px;width:19px;height:19px;border-radius:10px;background:#fff;color:#111;font:800 11px system-ui;display:none;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 6px #0008}
.clip.sel .cx{display:flex}

#lineLayer{position:absolute;left:44px;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none;z-index:6}
#line{position:absolute;top:0;bottom:0;left:0;width:0;will-change:transform}
#lineBar{position:absolute;top:32px;bottom:0;left:-1px;width:2px;background:var(--red);box-shadow:0 0 10px rgba(255,71,87,.55)}
#lineHit{position:absolute;top:36px;bottom:0;left:-15px;width:30px;pointer-events:auto}
#circle{position:absolute;top:3px;left:-15px;width:30px;height:30px;border-radius:15px;background:var(--red);pointer-events:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(255,71,87,.5);overflow:hidden;transition:transform .2s var(--ease),opacity .25s}
#circle:active{transform:scale(.88)}
#circle.dis{opacity:.5}
#circleIc svg{width:14px;height:14px}
#circleIc.sl{animation:sl .28s var(--ease)}#circleIc.sr{animation:sr .28s var(--ease)}
@keyframes sl{from{transform:translateX(16px);opacity:0}}@keyframes sr{from{transform:translateX(-16px);opacity:0}}
#modeLbl{position:absolute;top:7px;left:22px;white-space:nowrap;font:700 11px system-ui;background:rgba(10,11,14,.9);border:1px solid var(--ln);padding:4px 9px;border-radius:9px;opacity:0;transform:translateX(-4px);transition:opacity .25s,transform .25s var(--ease);display:flex;align-items:center;gap:7px}
#modeLbl.show{opacity:1;transform:none}
#modeLbl.left{left:auto;right:22px}
#modeLbl .dots{display:flex;gap:3px}
#modeLbl .dots i{width:5px;height:5px;border-radius:3px;background:#4a505c}
#modeLbl .dots i.on{background:var(--red)}

#stopBtn{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translate(-50%,100px);width:54px;height:54px;border-radius:27px;background:rgba(31,35,43,.95);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;transition:transform .4s var(--ease);z-index:20;box-shadow:0 8px 24px #000a}
#stopBtn.show{transform:translate(-50%,0)}
#stopBtn i{width:17px;height:17px;border-radius:3px;background:var(--red)}

/* ---------- Einspielen ---------- */
#stripes{display:flex;gap:4px;padding:6px 10px 0;flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
#stripes::-webkit-scrollbar{display:none}
.stp{flex:1 1 0;min-width:70px;max-width:200px;height:20px;border-radius:5px;background:var(--p1);border:1px solid var(--ln);font:700 9.5px system-ui;color:#666d7a;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px 0 9px;transition:all .3s var(--ease)}
.stp::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.4;transition:opacity .3s}
.stp.on{background:color-mix(in srgb,var(--c) 26%,var(--p2));color:var(--tx);border-color:color-mix(in srgb,var(--c) 70%,transparent)}
.stp.on::before{opacity:1}
.stp0{color:#4c525e;font:600 10px system-ui;height:20px;line-height:20px}
#rbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:4px 10px;flex:0 0 auto;min-height:44px}
.rfill{display:none}
.rbc{flex:1;display:flex;justify-content:center;min-width:0}
.lage{display:flex;align-items:center;height:28px;border-radius:14px;background:var(--p1);border:1px solid var(--ln);overflow:hidden}
.lage button{width:32px;height:100%;font:400 17px system-ui;color:var(--dim)}
.lage button:active{background:var(--p3)}
.lage span{font:700 11.5px ui-monospace,Menlo,monospace;min-width:68px;text-align:center}
.rpos{font:600 11px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
.rpos b{color:var(--tx)}
#recBtn{width:36px;height:36px;border-radius:18px;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .15s}
#recBtn:active{transform:scale(.9)}
#recBtn i{width:16px;height:16px;border-radius:8px;background:var(--red);transition:border-radius .3s var(--ease),width .3s,height .3s}
#recBtn.on i{border-radius:3px;width:13px;height:13px}
#recBtn.on{animation:pulse 1.4s infinite}
#recBtn.arm i{animation:blink .5s infinite alternate}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,71,87,.6)}70%{box-shadow:0 0 0 12px rgba(255,71,87,0)}100%{box-shadow:0 0 0 0 rgba(255,71,87,0)}}
@keyframes blink{to{opacity:.25}}
body.recording #rClose,body.recording #rPre{opacity:.3;pointer-events:none}
#rinst{flex:1;min-height:0;position:relative;touch-action:none}
#padArea{position:absolute;left:10px;right:10px;top:2px;bottom:44px;display:grid;gap:8px}
.pad{border-radius:18px;background:var(--p2);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font:800 16px system-ui;letter-spacing:.5px;color:#9aa1ad;position:relative;touch-action:none;transition:background .1s,transform .1s,color .1s}
.pad.hit{background:var(--c);color:#111;transform:scale(.985);transition:none}
.pad.pop{animation:pop .4s var(--ease)}
.pad .px{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:12px;font-size:11px;color:var(--dim);display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);transition:opacity .3s}
body.recording .pad .px{opacity:0;pointer-events:none}
#padPlus{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:16px;background:var(--p2);border:1px solid var(--ln);font:300 20px/1 system-ui;color:var(--dim);transition:opacity .3s}
body.recording #padPlus{opacity:.25;pointer-events:none}
#bigPlus{position:absolute;inset:0;margin:auto;width:120px;height:120px;border-radius:60px;border:2px dashed #464d5b;font:200 56px/1 system-ui;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .2s var(--ease)}
#bigPlus small{font:600 11px system-ui;letter-spacing:.5px}
#bigPlus:active{transform:scale(.94)}
#kbw{position:absolute;left:10px;right:10px;top:2px;bottom:10px;display:flex;gap:7px}
.oc{flex:0 0 var(--ocw,40px);display:flex;flex-direction:column;gap:7px}
.oc button{flex:1;border-radius:12px;background:var(--p1);border:1px solid var(--ln);font:300 22px system-ui;color:var(--dim);transition:opacity .2s,background .2s}
.oc button:active{background:var(--p3)}
.oc button:disabled{opacity:.25}
#keys{flex:1;position:relative;touch-action:none;view-transition-name:keys}
#kbopt{position:absolute;left:10px;right:10px;top:0;min-height:30px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font:600 11px system-ui;color:var(--dim)}
#kbopt::-webkit-scrollbar{display:none}
#rinst.hasopt #kbw{top:var(--ot,34px)}
#kbopt .sep{flex:0 0 auto;width:1px;height:14px;background:var(--ln);margin:0 4px}
#kbopt .br{flex-basis:100%;height:0}
#kbopt button{flex:0 0 auto;height:26px;padding:0 11px;border-radius:13px;background:var(--p1);border:1px solid var(--ln);color:var(--dim);font:600 11px system-ui}
#kbopt button.on{background:var(--c);color:#111;border-color:transparent}
#keys.m1 .wk{background:#d9e6fa}#keys.m1 .bk{background:#10192b}
#keys.m2 .wk{background:#f1dcec}#keys.m2 .bk{background:#2a1325}
#keys.m1 .wk.on,#keys.m2 .wk.on{background:var(--c)}#keys.m1 .bk.on,#keys.m2 .bk.on{background:var(--c)}
#whites{position:absolute;inset:0;display:flex;gap:3px}
.wk{flex:1;background:#eceef3;border-radius:0 0 11px 11px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;color:#777;font:700 11px system-ui;touch-action:none;transition:background .12s}
.wk.on{background:var(--c);color:#111;transition:none}
.bk{position:absolute;top:0;height:60%;background:#15171c;border:1px solid #000;border-top:0;border-radius:0 0 9px 9px;z-index:2;touch-action:none;transition:background .12s}
.bk.on{background:var(--c);transition:none}
#cnt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:200 130px system-ui;color:#fff;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10;text-shadow:0 6px 40px #000}
#cnt.show{opacity:1}
#cnt.beat span{animation:cbeat .45s var(--ease)}
@keyframes cbeat{from{transform:scale(1.35);opacity:0}}

/* ---------- Overlay ---------- */
#ov{position:fixed;inset:0;background:rgba(6,7,10,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:center;justify-content:center;z-index:40;padding:14px}
#ov.show{opacity:1;pointer-events:auto}
#panel{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:16px;width:min(640px,100%);max-height:100%;overflow:auto;transform:translateY(18px) scale(.97);transition:transform .38s var(--ease);box-shadow:0 20px 60px #000b}
#ov.show #panel{transform:none}
#panel.narrow{width:min(380px,100%)}
.ptitle{font:800 15px system-ui;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.ptitle small{font:600 11px system-ui;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{min-height:62px;border-radius:13px;background:var(--p2);border:1px solid var(--ln);border-left:4px solid var(--c);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:8px 12px;text-align:left;transition:transform .15s,background .25s}
.tile b{font:800 14px system-ui;color:var(--c)}
.tile small{color:var(--dim);font-size:11px}
.tile.on{background:color-mix(in srgb,var(--c) 20%,var(--p2))}
.tile:active{transform:scale(.96)}
.tile:disabled{opacity:.3}
.sub{font:700 11px system-ui;color:var(--dim);margin:16px 0 8px;letter-spacing:.5px;text-transform:uppercase}
.prs{display:flex;flex-wrap:wrap;gap:6px}
.pc{height:32px;padding:0 13px;border-radius:16px;background:var(--p2);border:1px solid var(--ln);font:600 12px system-ui;transition:all .2s}
.pc.on{background:var(--c);color:#111;border-color:var(--c)}
.pc:active{transform:scale(.95)}
.prow{display:flex;align-items:center;gap:10px;margin-top:16px}
.prow input[type=range]{flex:1}
.sp{flex:1}
.lab{color:var(--dim);font-size:12px;white-space:nowrap}
.danger{color:#ff6b7a!important}
.note{color:var(--dim);font-size:12px;margin:12px 0 0}
input[type=range]{accent-color:var(--red);height:30px}
.mi{display:flex;align-items:center;gap:12px;white-space:nowrap;width:100%;min-height:44px;padding:0 12px;border-radius:11px;font:600 14px system-ui;text-align:left;transition:background .2s}
.mi:active{background:var(--p2)}
.mi svg{width:17px;height:17px;color:var(--dim)}
.mi input{flex:1}
.mi .v{font:600 12px ui-monospace,monospace;color:var(--dim);min-width:52px;text-align:right}
.pl{display:flex;align-items:center;gap:6px;border-radius:11px;transition:background .2s}
.pl:active{background:var(--p2)}
.plo{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;text-align:left}
.plo b{font:700 14px system-ui}
.plo small{color:var(--dim);font-size:11px}
.pldel{width:36px;height:36px;border-radius:18px;color:var(--dim)}
.bpmrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0}
.bpmrow button{width:46px;height:46px;border-radius:23px;background:var(--p2);border:1px solid var(--ln);font:300 24px system-ui}
.bpmrow span{font:200 46px system-ui;min-width:100px;text-align:center}
#toast{pointer-events:none;position:fixed;left:50%;top:14px;transform:translate(-50%,-70px);background:rgba(20,22,27,.96);border:1px solid var(--ln);color:#fff;border-radius:12px;padding:9px 16px;font:600 12px system-ui;z-index:60;transition:transform .4s var(--ease);max-width:90vw;text-align:center;box-shadow:0 8px 24px #0009}
#toast.show{transform:translate(-50%,0)}
#busy{position:fixed;inset:0;background:rgba(6,7,10,.75);z-index:80;display:flex;align-items:center;justify-content:center;font:600 15px system-ui;opacity:0;pointer-events:none;transition:opacity .3s}
#busy.show{opacity:1;pointer-events:auto}

/* ---------- Hochkant ---------- */
@media (orientation:portrait){
  :root{--ocw:34px}
  #rbar .rfill{display:block;flex:1;order:1}
  #rbar #rClose,#rbar #rPre{order:0}
  #rbar #rQ,#rbar #rMet,#rbar #recBtn{order:2}

    s.clips=(s.clips||[]).map(c=>Object.assign({id:nid(),start:0,len:4,off:0,srcLen:4,ev:[]},c));

function migrate(){
  if(localStorage.getItem('gbx:mig'))return;try{localStorage.setItem('gbx:mig','1');}catch(e){}
  const d=lsGet('groovebox_v2')||lsGet('groovebox_v1');if(!d||!d.tracks||!d.tracks.length)return;
  const p=newProject('Altes Projekt');p.bpm=d.bpm||100;p.tracks=[];
  const pl=(d.arr&&d.arr.pl)||[];
  const mk=(src,start,len)=>{const L=src.bars*4,ev=[];for(let k=0;k*L<len;k++)src.ev.forEach(e=>{const t=e.t/4+k*L;if(t<len)ev.push({t,n:e.n,d:(e.d||.5)/4,v:e.v||.85});});return {id:nid(),start,len,off:0,srcLen:len,ev};};
  d.tracks.forEach(t=>{
    if(!INST[t.type])return;
    const s=newSnd();s.inst=t.type;s.preset=t.preset|0;s.vol=t.vol==null?.8:t.vol;s.mute=!!t.mute;
    s.oct=t.oct==null?(INST[t.type].oct||3):t.oct;s.nOct=2;if(t.type==='drum')s.pads=[0,1,2,3,4,5,6,7];
    const clips=t.clips||(t.ev?[{id:0,bars:d.bars||2,ev:t.ev}]:[]);
    const mine=pl.filter(x=>x.tid===t.id);
    if(mine.length)mine.forEach(x=>{const src=clips.find(c=>c.id===x.cid);if(src)s.clips.push(mk(src,x.start*4,x.len*4));});
    else{const src=clips.find(c=>c.id===t.cur)||clips[0];if(src&&src.ev&&src.ev.length)s.clips.push(mk(src,0,src.bars*4));}
    if(s.inst&&!presets(s)[s.preset])s.preset=0;
    p.tracks.push(s);
    const end=s.clips.reduce((m,c)=>Math.max(m,c.start+c.len),0);
    if(t.fx&&end>0)[['dly','delay'],['rev','reverb'],['drv','dist']].forEach(([o,n])=>{
      if(t.fx[o]){const f=newFx();f.fx=n;f.clips=[{id:nid(),start:0,len:end,off:0,srcLen:end,pts:[{x:0,y:.5}]}];p.tracks.push(f);}});
  });
  if(!p.tracks.length)return;
  lsSet(PK+p.id,p);const ix=index();ix.unshift({id:p.id,name:p.name,updated:p.updated});lsSet(IDX,ix);
}

let ctx=null,master,comp,lim,clip,clickBus,noiseBuf,driveCurve,OFFLINE=false,wireDirty=true;

function initEngine(c){
  ctx=c;
  comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.knee.value=20;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.15;
  master=ctx.createGain();master.gain.value=.9;master.connect(comp);
  lim=ctx.createDynamicsCompressor();lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.08;
  clip=ctx.createWaveShaper();comp.connect(lim);lim.connect(clip);clip.connect(ctx.destination);setLimiter(P?P.lim:0);
  clickBus=ctx.createGain();clickBus.gain.value=.8;clickBus.connect(comp);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  driveCurve=new Float32Array(1024);for(let i=0;i<1024;i++)driveCurve[i]=Math.tanh((i/512-1)*2.5);
}
/* Harter Limiter am Master: Kompressor mit Ratio 20 + Hard-Clip bei der Linie */
function setLimiter(db){
  if(!lim)return;db=Math.min(0,db);const th=db>=0?0:db-1;lim.threshold.value=th;
  /* Chromes automatischen Make-up-Gain ausgleichen */
  const fg=Math.pow(10,(th+(0-th)/20)/20);const mk=ctx.createGain?1:1;
  if(!lim._pg){lim._pg=ctx.createGain();lim.disconnect();lim.connect(lim._pg);lim._pg.connect(clip);}
  lim._pg.gain.value=Math.pow(fg,.6);
  const c=Math.pow(10,db/20),n=2048,cv=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;cv[i]=Math.max(-c,Math.min(c,x));}
  clip.curve=db>=0?null:cv;
}
function irBuf(){
  if(ctx._ir)return ctx._ir;
  const len=Math.floor(ctx.sampleRate*2.4),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.7);}
  return ctx._ir=ir;
}
function ensureAudio(){
  if(OFFLINE)return;
  if(!ctx)initEngine(new AC({latencyHint:'interactive'}));
  if(ctx.state!=='running')ctx.resume();
  if(P&&(wireDirty||P.tracks.some(t=>t.kind==='snd'?!t.nodes:(t.fx&&(!t.fxn||t.fxn.type!==t.fx)))))wire();
}
function disposeTrack(t){
  if(t.nodes){try{t.nodes.bus.disconnect();t.nodes.S.vol.disconnect();t.nodes.S.pan.disconnect();if(t.nodes.voc)t.nodes.voc.kill();}catch(e){}t.nodes=null;}
  if(t.fxn){try{t.fxn.out.disconnect();t.fxn.kill();}catch(e){}t.fxn=null;}
}
function teardown(){if(P)P.tracks.forEach(disposeTrack);}
const stripOf=t=>t.kind==='fx'?(t.fxn&&t.fxn.S):(t.nodes&&t.nodes.S);

/* Kanalzug: Lautstärke -> Kompressor -> Pan (-> Pegelmesser) */
const SPD={fast:[.003,.09],mid:[.012,.22],slow:[.04,.55]};
function mkStrip(){
  const vol=ctx.createGain(),cmp=ctx.createDynamicsCompressor(),mk=ctx.createGain(),pan=ctx.createStereoPanner(),an=OFFLINE?null:ctx.createAnalyser();
  vol.connect(cmp);cmp.connect(mk);mk.connect(pan);if(an){an.fftSize=512;an.smoothingTimeConstant=0;pan.connect(an);}
  return {vol,cmp,mk,pan,an};
}
const relinkAn=S=>{if(S&&S.an)S.pan.connect(S.an);};
function ap(p,v,t,ramp,live){
  if(live)p.setTargetAtTime(v,ctx.currentTime,.015);
  else if(ramp)p.linearRampToValueAtTime(v,t);
  else{p.cancelScheduledValues(t);p.setValueAtTime(v,t);}
}
const MIXMAP={vol:[v=>v,y=>y],pan:[v=>(v+1)/2,y=>y*2-1],thr:[v=>(v+48)/48,y=>y*48-48],red:[v=>v/24,y=>y*24]};
const mixToY=(p,v)=>clamp(MIXMAP[p][0](v),0,1),mixFromY=(p,y)=>MIXMAP[p][1](clamp(y,0,1));
function eff(tr){const m=tr.mo||{};return {vol:m.vol!=null?m.vol:tr.vol,pan:m.pan!=null?m.pan:tr.pan,thr:m.thr!=null?m.thr:tr.cp.t,red:m.red!=null?m.red:tr.cp.r};}
function cmpSet(S,sp,thr,red,t,live){
  thr=Math.min(-1,thr);const off=sp==='off'||red<.3,[a,r]=SPD[sp]||SPD.mid;
  let ratio=1,mk=1;
  if(!off){const x=red/(-thr);ratio=x>=.95?20:clamp(1/(1-x),1,20);mk=Math.pow(10,-.6*red/20);}
  [[S.cmp.threshold,off?0:thr],[S.cmp.ratio,ratio],[S.cmp.knee,off?0:3],[S.cmp.attack,a],[S.cmp.release,r],[S.mk.gain,mk]].forEach(([q,v])=>ap(q,v,t,false,live));
}
function applyStrip(tr,t,ramp,live){
  const S=stripOf(tr);if(!S||!ctx)return;const e=eff(tr);
  if(tr.kind==='snd')ap(S.vol.gain,tr.mute?0:e.vol,t,ramp,live);
  else if(tr.fxn){tr.fxn.scale=e.vol;if(tr.fxn.refresh)tr.fxn.refresh(live?ctx.currentTime:t);}
  ap(S.pan.pan,e.pan,t,ramp,live);cmpSet(S,tr.cp.s,e.thr,e.red,t,live);
}
function ensureAudio(){
  if(OFFLINE)return;
  if(!ctx)initEngine(new AC({latencyHint:'interactive'}));
  if(ctx.state!=='running')ctx.resume();
  if(P&&(wireDirty||P.tracks.some(t=>t.kind==='snd'?(!t.nodes||!!t.nodes.voc!==(t.inst==='voc')):(t.fx&&(!t.fxn||t.fxn.type!==t.fx)))))wire();
}
function modOfVoc(i){for(let k=i+1;k<P.tracks.length;k++)if(P.tracks[k].kind==='snd')return P.tracks[k].inst==='audio'?P.tracks[k]:null;return null;}
function wire(){
  P.tracks.forEach(t=>{
    if(t.kind==='snd'&&t.nodes&&(!!t.nodes.voc!==(t.inst==='voc')))disposeTrack(t);
    if(t.kind==='snd'&&!t.nodes){
      const bus=mkG(),S=mkStrip();t.nodes={bus,S,vol:S.vol,pan:S.pan,dst:bus};
      if(t.inst==='voc'){const v=makeVocoder();v.out.connect(bus);t.nodes.voc=v;t.nodes.dst=v.carIn;}
      applyStrip(t,ctx.currentTime,false,false);
    }
    if(t.kind==='fx'&&(t.fxn?t.fxn.type!==t.fx:t.fx)){
      if(t.fxn){try{t.fxn.out.disconnect();t.fxn.kill();}catch(e){}}
      t.fxn=t.fx?makeFx(t.fx,t):null;if(t.fxn)applyStrip(t,ctx.currentTime,false,false);
    }
  });
  P.tracks.forEach(t=>{try{if(t.nodes){t.nodes.bus.disconnect();t.nodes.S.pan.disconnect();relinkAn(t.nodes.S);}if(t.fxn&&!t.fxn.mix){t.fxn.out.disconnect();relinkAn(t.fxn.S);}}catch(e){}});
  let cur=null,last=null;
  P.tracks.forEach(t=>{
    if(t.kind==='snd'){if(cur)cur.connect(last.S.vol);cur=t.nodes.bus;last=t.nodes;}
    else if(t.fxn&&!t.fxn.mix&&cur){cur.connect(t.fxn.inp);cur=t.fxn.out;}
  });
  if(cur)cur.connect(last.S.vol);
  P.tracks.forEach((t,i)=>{
    if(t.kind!=='snd'||!t.nodes)return;let tgt=master;
    if(t.inst==='audio'){for(let k=i-1;k>=0;k--){const u=P.tracks[k];if(u.kind==='snd'){if(u.inst==='voc'&&u.nodes&&u.nodes.voc)tgt=u.nodes.voc.modIn;break;}}}
    t.nodes.S.pan.connect(tgt);
  });
  P.tracks.forEach((t,i)=>{if(t.nodes&&t.nodes.voc)t.nodes.voc.setActive(!!modOfVoc(i));});
  wireDirty=false;
}
function applyVol(tr){if(tr.nodes&&ctx)applyStrip(tr,0,false,true);}

/* Vocoder: 16 Bänder, Hüllkurve der Aufnahme steuert die Bänder des Synths */
function makeVocoder(){
  const carIn=mkG(),modIn=mkG(),out=mkG(),byp=mkG(),bands=mkG(),N=16;
  out.gain.value=1.7;carIn.connect(byp);byp.connect(out);byp.gain.value=1;carIn.connect(bands);bands.gain.value=0;
  const absC=new Float32Array(1024);for(let i=0;i<1024;i++)absC[i]=Math.abs(i/512-1);
  const env=(src,g)=>{const sh=ctx.createWaveShaper();sh.curve=absC;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=40;lp.Q.value=.5;const sc=mkG();sc.gain.value=g;src.connect(sh);sh.connect(lp);lp.connect(sc);return sc;};
  for(let i=0;i<N;i++){
    const f=130*Math.pow(7200/130,i/(N-1));
    const cb=ctx.createBiquadFilter(),mb=ctx.createBiquadFilter();cb.type=mb.type='bandpass';cb.frequency.value=mb.frequency.value=f;cb.Q.value=mb.Q.value=5.5;
    const vca=mkG();vca.gain.value=0;bands.connect(cb);cb.connect(vca);vca.connect(out);modIn.connect(mb);env(mb,16).connect(vca.gain);
  }
  const nz=ctx.createBufferSource();nz.buffer=noiseBuf;nz.loop=true;nz.start();
  const nh=ctx.createBiquadFilter();nh.type='highpass';nh.frequency.value=5500;const nv=mkG();nv.gain.value=0;
  const mh=ctx.createBiquadFilter();mh.type='highpass';mh.frequency.value=5000;modIn.connect(mh);env(mh,12).connect(nv.gain);
  nz.connect(nh);nh.connect(nv);const ng=mkG();ng.gain.value=.9;bands.connect(ng);nv.connect(out);
  return {carIn,modIn,out,setActive(a){byp.gain.value=a?0:1;bands.gain.value=a?1:0;},kill(){try{nz.stop();}catch(e){}}};
}

/* Effekte: jede Instanz hat Dry/Wet; die Automation steuert die Stärke 0..1 */
function makeFx(type,tr){

    const d=ctx.createDelay(3),fb=ctx.createGain(),lp=ctx.createBiquadFilter();
    d.delayTime.value=spb()*.75;fb.gain.value=.42;lp.type='lowpass';lp.frequency.value=3200;
    inp.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(wet);o.dt=d;o.map=a=>[1,a*.85];
  }else if(type==='reverb'){
    const cv=ctx.createConvolver();cv.buffer=irBuf();inp.connect(cv);cv.connect(wet);o.map=a=>[1-a*.35,a*1.15];
  }else if(type==='chorus'){
    [[.012,.7,.0025],[.019,1.13,.003]].forEach(([dt,f,dep])=>{
      const d=ctx.createDelay(.1);d.delayTime.value=dt;const l=ctx.createOscillator(),lg=ctx.createGain();
      l.frequency.value=f;lg.gain.value=dep;l.connect(lg);lg.connect(d.delayTime);l.start();oscs.push(l);inp.connect(d);d.connect(wet);});
    o.map=a=>[1-a*.25,a*.8];
  }else if(type==='phaser'){
    const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.45;lg.gain.value=650;l.connect(lg);l.start();oscs.push(l);
    let prev=inp;for(let i=0;i<6;i++){const ap=ctx.createBiquadFilter();ap.type='allpass';ap.frequency.value=900;ap.Q.value=.6;lg.connect(ap.frequency);prev.connect(ap);prev=ap;}
    prev.connect(wet);o.map=a=>[1-a*.45,a*.85];
  }else if(type==='eq'){
    const ls=ctx.createBiquadFilter(),pk=ctx.createBiquadFilter(),hs=ctx.createBiquadFilter();ls.type='lowshelf';pk.type='peaking';hs.type='highshelf';
    inp.connect(ls);ls.connect(pk);pk.connect(hs);hs.connect(wet);o.eqf={ls,pk,hs};o.map=a=>[0,1];
  }else{
    const pre=ctx.createGain(),sh=ctx.createWaveShaper(),lp=ctx.createBiquadFilter(),post=ctx.createGain();
    sh.curve=driveCurve;sh.oversample='2x';lp.type='lowpass';lp.frequency.value=5200;post.gain.value=.5;
    inp.connect(pre);pre.connect(sh);sh.connect(lp);lp.connect(post);post.connect(wet);o.pre=pre;o.map=a=>[1-a,a];
  }
  o.set=(a0,t,ramp)=>{
    o.base=a0;const a=clamp(a0*o.scale,0,1);
    const [dv,wv]=o.map(a),ps=[[dry.gain,dv],[wet.gain,wv]];if(o.pre)ps.push([o.pre.gain,1+a*18]);
    if(o.eqf){const k=Math.min(1,a*2),c=o.cfg||EQD,f=o.eqf;ps.push([f.ls.gain,c.lg*k],[f.ls.frequency,c.lf],[f.pk.gain,c.mg*k],[f.pk.frequency,c.mf],[f.pk.Q,c.mq],[f.hs.gain,c.hg*k],[f.hs.frequency,c.hf]);}
    ps.forEach(([p,v])=>{if(ramp)p.linearRampToValueAtTime(v,t);else{p.cancelScheduledValues(t);p.setValueAtTime(v,t);}});
  };
  o.refresh=t=>o.set(o.base,t==null?ctx.currentTime:t,false);
  o.set(0,ctx.currentTime,false);
  const S=mkStrip();out.connect(S.vol);o.S=S;o.out=S.pan;
  return o;
}

function click(t,acc){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=acc?1600:1000;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(acc?.22:.13,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.04);
  o.connect(g);g.connect(clickBus);o.start(t);o.stop(t+.06);
}

/* Drums (808-inspiriert) */
function drum(tr,id,t,v){
  const d=tr.nodes.bus,K=KITS[tr.preset]||KITS[0];
  const env=(g,peak,dur)=>{g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);};
  const osc=(type,f0,f1,fdur,stopT)=>{const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+fdur);o.start(t);o.stop(t+stopT);return o;};
  const noise=dur=>{const s=ctx.createBufferSource();s.buffer=noiseBuf;s.start(t,Math.random()*.4);s.stop(t+dur);return s;};
  const metal=(fs,dur,hpF)=>{const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=hpF;fs.forEach(f=>osc('square',f,0,0,dur+.05).connect(hp));return hp;};
  const HAT=[205.3,304.4,369.6,522.7,540,800];
  switch(id){
    case 0:{const g=ctx.createGain();env(g,v,.5*K.kd+.15);osc('sine',165,K.kp,.08+.05*K.kd,.7*K.kd+.25).connect(g);g.connect(d);
      const cg=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2500;env(cg,v*.35,.012);noise(.02).connect(lp);lp.connect(cg);cg.connect(d);break;}
    case 1:{const g=ctx.createGain();env(g,v*.6,.14*K.sn+.04);osc('triangle',200,150,.08,.3).connect(g);g.connect(d);
      const ng=ctx.createGain(),hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1500;env(ng,v*.7,.2*K.sn+.05);noise(.4).connect(hp);hp.connect(ng);ng.connect(d);break;}
    case 2:{const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1250;bp.Q.value=1.1;const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);
      [0,.011,.023].forEach(o=>{g.gain.setValueAtTime(v*.9,t+o);g.gain.exponentialRampToValueAtTime(.08,t+o+.009);});
      g.gain.setValueAtTime(v*.9,t+.035);g.gain.exponentialRampToValueAtTime(.001,t+.3);noise(.4).connect(bp);bp.connect(g);g.connect(d);break;}
    case 3:{const g=ctx.createGain();env(g,v*.45,.045);const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700;bp.Q.value=2;
      [1667,455].forEach(f=>osc('square',f,0,0,.07).connect(bp));bp.connect(g);g.connect(d);break;}
    case 4:case 5:{const open=id===5,dur=(open?.38:.06)*K.hd;if(!open&&tr.lastOpen)tr.lastOpen.gain.setTargetAtTime(0,t,.004);
      const g=ctx.createGain();env(g,v*.14,dur);const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=10000;bp.Q.value=.6;
      metal(HAT,dur,7200).connect(bp);bp.connect(g);
      if(open){const c=ctx.createGain();g.connect(c);c.connect(d);tr.lastOpen=c;}else g.connect(d);break;}
    case 6:{const g=ctx.createGain();env(g,v*.9,.45);osc('sine',170,100,.2,.55).connect(g);g.connect(d);break;}
    case 7:{const g=ctx.createGain();g.gain.setValueAtTime(v*.25,t);g.gain.exponentialRampToValueAtTime(v*.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);
      const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=.8;[540,800].forEach(f=>osc('square',f,0,0,.55).connect(bp));bp.connect(g);g.connect(d);break;}
    case 8:{const g=ctx.createGain();env(g,v*.85,.35);osc('sine',260,160,.18,.45).connect(g);g.connect(d);break;}
    case 9:{const g=ctx.createGain();env(g,v*.8,.2);osc('sine',420,330,.04,.25).connect(g);g.connect(d);break;}
    case 10:{const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*.35,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.07);
      const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=5500;noise(.1).connect(hp);hp.connect(g);g.connect(d);break;}
    case 11:{const dur=1.3*K.hd,g=ctx.createGain();env(g,v*.12,dur);const hp=metal(HAT.map(f=>f*1.1),dur,5000);
      const ng=ctx.createGain();env(ng,v*.5,dur*.8);noise(dur).connect(ng);ng.connect(hp);hp.connect(g);g.connect(d);break;}
    case 12:{const g=ctx.createGain();env(g,v*.5,.06);osc('triangle',2500,0,0,.08).connect(g);g.connect(d);break;}
  }
}

/* Synth-Stimmen */
function releaser(rel,r,t0,nodes){
  let offT=null;
  return tt=>{
    tt=Math.max(tt,t0+.005);if(offT!==null&&tt>=offT)return;
    if(offT!==null)rel.gain.cancelScheduledValues(tt);offT=tt;
    rel.gain.setValueAtTime(1,tt);rel.gain.setTargetAtTime(0,tt,r/3);
    const end=tt+r+.25;nodes.forEach(o=>{try{o.stop(end);}catch(e){}});
  };
}
function subVoice(dest,t,f,vel,Pr){
  const kt=Math.min(4,Math.max(.5,Math.pow(f/131,.6)));
  const amp=ctx.createGain(),rel=ctx.createGain(),flt=ctx.createBiquadFilter(),mix=ctx.createGain();
  flt.type='lowpass';flt.Q.value=Pr.res;
  const base=Math.min(18000,Pr.cut*kt),peak=Math.min(18000,(Pr.cut+Pr.env)*kt),sus=Math.min(18000,(Pr.cut+Pr.env*Pr.fs)*kt);
  flt.frequency.setValueAtTime(base,t);flt.frequency.linearRampToValueAtTime(peak,t+.005);flt.frequency.setTargetAtTime(sus,t+.005,Pr.fd/3);
  mix.gain.value=1/Pr.o.length;
  const oscs=Pr.o.map(([ty,oc,dt])=>{const o=ctx.createOscillator();o.type=ty;o.frequency.value=f*Math.pow(2,oc);o.detune.value=dt;o.connect(mix);o.start(t);return o;});
  let node=mix;if(Pr.hp){const h=ctx.createBiquadFilter();h.type='highpass';h.frequency.value=Pr.hp;mix.connect(h);node=h;}
  node.connect(flt);flt.connect(amp);amp.connect(rel);rel.connect(dest);
  const lvl=Pr.g*vel;amp.gain.setValueAtTime(.0001,t);amp.gain.linearRampToValueAtTime(lvl,t+Pr.a);amp.gain.setTargetAtTime(lvl*Pr.s,t+Pr.a,Pr.d/3);
  rel.gain.value=1;return {off:releaser(rel,Pr.r,t,oscs)};
}
function fmVoice(dest,t,f,vel,Pr){
  const amp=ctx.createGain(),rel=ctx.createGain();amp.connect(rel);rel.connect(dest);
  const nodes=[],sum=Pr.pairs.reduce((a,p)=>a+p[5],0);
  Pr.pairs.forEach(([c,m,idx,isus,idec,lvl,iatt])=>{
    const car=ctx.createOscillator(),mod=ctx.createOscillator(),mg=ctx.createGain(),pg=ctx.createGain();
    car.frequency.value=f*c;mod.frequency.value=f*m;const peak=idx*f*m*(.55+.45*vel);
    if(iatt){mg.gain.setValueAtTime(peak*.25,t);mg.gain.linearRampToValueAtTime(peak,t+iatt);}else mg.gain.setValueAtTime(peak,t);
    mg.gain.setTargetAtTime(peak*isus,t+iatt,idec/3);pg.gain.value=lvl/sum;
    mod.connect(mg);mg.connect(car.frequency);car.connect(pg);pg.connect(amp);car.start(t);mod.start(t);nodes.push(car,mod);
  });
  const lvl=Pr.g*vel;amp.gain.setValueAtTime(.0001,t);amp.gain.linearRampToValueAtTime(lvl,t+Pr.a);amp.gain.setTargetAtTime(lvl*Pr.s,t+Pr.a,Pr.d/3);
  rel.gain.value=1;return {off:releaser(rel,Pr.r,t,nodes)};
}
function createVoice(tr,m,v,t){
  const f=mtof(m),Pr=PRE[tr.inst][tr.preset]||PRE[tr.inst][0];
  const dst=tr.nodes.dst||tr.nodes.bus;
  return INST[tr.inst].eng==='fm'?fmVoice(dst,t,f,v,Pr):subVoice(dst,t,f,v,Pr);
}

/* =====================================================================
   Transport
   ===================================================================== */
let playing=false,TO={},segs=[{T:0,B:0}],nextB=0,evs=[],evI=0,timer=null,liveV=[],playFrom=0,songEndB=0,firstStep=true;
function timeOf(b){const s=segs[segs.length-1];return s.T+(b-s.B)*spb();}
function beatAt(t){for(let i=segs.length-1;i>0;i--){if(t>=segs[i].T)return segs[i].B+(t-segs[i].T)/spb();}return segs[0].B+(t-segs[0].T)/spb();}
function lowerB(b){let i=0;while(i<evs.length&&evs[i].b<b-1e-9)i++;return i;}
function audible(tr){if(tr.mute)return false;if(!TO.rec)return true;if(tr===TO.rec)return !!TO.loop;return tr.listen!==false;}
function buildEvs(){
  const out=[];
  P.tracks.forEach(tr=>{
    if(tr.kind!=='snd'||!tr.inst||!audible(tr))return;
    if(tr.inst==='audio'){tr.clips.forEach(c=>{if(!c.aid)return;const e=c.start+c.len;if(e<=nextB+1e-9)return;const b=Math.max(c.start,nextB);out.push({b,tr,aud:true,c,o:c.off+(b-c.start),d:e-b});});return;}
    tr.clips.forEach(c=>{const a=c.off,b=c.off+c.len;
      c.ev.forEach(e=>{if(e.t>=a-1e-9&&e.t<b-1e-9)out.push({b:c.start+e.t-a,tr,n:e.n,v:e.v,d:Math.min(e.d||.25,b-e.t)});});});
  });
  return out.sort((x,y)=>x.b-y.b);
}
function ptsVal(pts,x){
  if(!pts.length)return 0;if(x<=pts[0].x)return pts[0].y;
  for(let i=1;i<pts.length;i++)if(x<=pts[i].x){const p=pts[i-1],q=pts[i];return q.x===p.x?q.y:p.y+(q.y-p.y)*(x-p.x)/(q.x-p.x);}
  return pts[pts.length-1].y;
}
function autoAt(tr,b){const c=tr.clips.find(c=>b>=c.start-1e-9&&b<c.start+c.len-1e-9);return c?ptsVal(c.pts,b-c.start+c.off):0;}
function hostAny(i){for(let k=i-1;k>=0;k--)if(!isMixTr(P.tracks[k]))return P.tracks[k];return null;}
function mixSet(tr,i,b,t,ramp){
  const f=FX[tr.fx],h=hostAny(i);if(!f||!h||TO.mixrec===h)return;
  const c=tr.clips.find(c=>b>=c.start-1e-9&&b<c.start+c.len-1e-9);
  h.mo=h.mo||{};if(c)h.mo[f.mix]=mixFromY(f.mix,ptsVal(c.pts,b-c.start+c.off));else delete h.mo[f.mix];
  applyStrip(h,t,ramp,false);
}
function fxStep(b,t,first){P.tracks.forEach((tr,i)=>{if(!tr.fxn)return;if(tr.fxn.mix)mixSet(tr,i,b,t,!first);else tr.fxn.set(autoAt(tr,b),t,!first);});}
function applyFxAt(b){if(!ctx||OFFLINE)return;fxStep(b,ctx.currentTime,true);}
function playEv(ev,t){
  if(!ev.tr.nodes)return;
  if(ev.aud){
    const buf=AUD[ev.c.aid];if(!buf)return;const src=ctx.createBufferSource();src.buffer=buf;src.connect(ev.tr.nodes.bus);
    const off=Math.max(0,ev.o*spb()),dur=Math.min(ev.d*spb(),buf.duration-off);if(dur<=0)return;src.start(t,off,dur);
    if(!OFFLINE)liveV.push({v:{off(tt){try{src.stop(tt);}catch(e){}}},end:t+dur+.5});return;
  }
  if(ev.tr.inst==='drum'){drum(ev.tr,ev.n,t,ev.v);if(!OFFLINE)flashPad(ev.tr,ev.n,t);}
  else{const v=createVoice(ev.tr,ev.n,ev.v,t),end=t+ev.d*spb();v.off(end);if(!OFFLINE){liveV.push({v,end:end+3});lightKey(ev.tr,ev.n,t,end);}}
}
function startT(from,opt){
  ensureAudio();if(playing)stopT();
  TO=opt||{};segs=[{T:ctx.currentTime+.08,B:from}];nextB=from;evs=buildEvs();evI=lowerB(from);firstStep=true;
  songEndB=songEnd();playing=true;clearInterval(timer);timer=setInterval(sched,25);sched();updPlayUI();
}
function sched(){
  if(!playing)return;const now=ctx.currentTime;liveV=liveV.filter(x=>x.end>now);
  let guard=0;
  while(timeOf(nextB)<now+.13&&guard++<500){
    const b=nextB;
    if(TO.mixrec&&b>=songEndB-1e-9&&b>0){setTimeout(finishMixRec,0);return;}
    if(TO.loop&&b>=TO.loop.e-1e-9){segs.push({T:timeOf(TO.loop.e),B:TO.loop.s});if(segs.length>5)segs.splice(1,1);nextB=TO.loop.s;evs=buildEvs();evI=lowerB(TO.loop.s);firstStep=true;continue;}
    const t=timeOf(b),e=b+STEP;
    if(TO.click&&Math.abs(b-Math.round(b))<1e-6&&(b<TO.recStart-1e-9||prefs.metro))click(t,((Math.round(b)%4)+4)%4===0);
    while(evI<evs.length&&evs[evI].b<e-1e-9){const ev=evs[evI++];if(ev.b>=b-1e-9)playEv(ev,timeOf(ev.b));}
    fxStep(b,t,firstStep);firstStep=false;nextB=e;
  }
}
function stopT(){
  playing=false;clearInterval(timer);
  if(ctx&&!OFFLINE){const now=ctx.currentTime;liveV.forEach(x=>x.v.off(now));liveV=[];applyFxAt(P?P.line:0);}
  TO={};updPlayUI();
}
function playSong(){
  ensureAudio();const end=songEnd();
  if(end<=0){toast('Noch nichts zum Abspielen');return;}
  if(P.line>=end-.01)P.line=lineVis=0;
  playFrom=P.line;startT(P.line,{loop:{s:0,e:end}});
}
function setBpm(v){
  v=clamp(Math.round(v),40,240);if(v===P.bpm)return;
  if(playing){const now=ctx.currentTime,b=beatAt(now);P.bpm=v;segs.push({T:now,B:b});if(segs.length>5)segs.splice(1,1);}else P.bpm=v;
  if(ctx)P.tracks.forEach(t=>{if(t.fxn&&t.fxn.dt)t.fxn.dt.delayTime.setTargetAtTime(spb()*.75,ctx.currentTime,.05);});
  updTop();save();
}

}

function layoutX(){

const AUTO_TOP=13;
function drawClip(o){
  const {c,tr,cv}=o,pp=P.ppb,w=Math.max(4,c.len*pp),h=LH[tr.kind]-6,dpr=Math.min(2,devicePixelRatio||1),cw=Math.min(w,3000);
  cv.width=Math.max(1,Math.round(cw*dpr));cv.height=Math.round(h*dpr);
  const g=cv.getContext('2d');g.setTransform(cv.width/w,0,0,cv.height/h,0,0);
  const col=trColor(tr),top=AUTO_TOP,bh=h-top-4;
  if(tr.kind==='snd'&&tr.inst==='audio'){
    const pk=c.pk||[],mid=top+bh/2;g.fillStyle=col;
    for(let x=0;x<w;x+=2){const a=(pk[Math.floor((c.off+x/pp)*8)]||0)/100,hh=Math.max(.7,a*bh/2);g.fillRect(x,mid-hh,1.5,hh*2);}
  }else if(tr.kind==='snd'){
    const vis=c.ev.filter(e=>e.t>=c.off-1e-9&&e.t<c.off+c.len-1e-9);if(!vis.length)return;g.fillStyle=col;
    if(tr.inst==='drum'){
      const ns=[...new Set(vis.map(e=>e.n))].sort((a,b)=>a-b),rh=bh/ns.length;
      vis.forEach(e=>g.fillRect((e.t-c.off)*pp,top+ns.indexOf(e.n)*rh+rh*.15,Math.max(2,Math.min(pp*.18,5)),Math.max(1.5,rh*.7)));
    }else{
      let lo=127,hi=0;vis.forEach(e=>{lo=Math.min(lo,e.n);hi=Math.max(hi,e.n);});if(hi-lo<8){const m=(lo+hi)/2;lo=Math.floor(m-4);hi=Math.ceil(m+4);}
      const rh=bh/(hi-lo+1);
      vis.forEach(e=>g.fillRect((e.t-c.off)*pp,top+(hi-e.n)*rh,Math.max(2,Math.min(e.d,c.off+c.len-e.t)*pp-1),Math.max(1.5,rh-.5)));
    }
  }else{
    const yOf=v=>top+(1-v)*bh;
    const xs=[0,...c.pts.map(p=>(p.x-c.off)*pp).filter(x=>x>0&&x<w),w];
    g.beginPath();xs.forEach((x,k)=>{const y=yOf(ptsVal(c.pts,c.off+x/pp));if(k)g.lineTo(x,y);else g.moveTo(x,y);});
    g.strokeStyle=col;g.lineWidth=1.7;g.stroke();
    g.lineTo(w,top+bh);g.lineTo(0,top+bh);g.closePath();g.globalAlpha=.18;g.fillStyle=col;g.fill();g.globalAlpha=1;
    const r=c.id===selClip?4.6:3.2;g.fillStyle='#fff';
    c.pts.forEach(p=>{const x=(p.x-c.off)*pp;if(x<-1||x>w+1)return;g.beginPath();g.arc(x,yOf(p.y),r,0,7);g.fill();});
  }
}

/* --- Clip-Operationen --- */
function carve(tr,s,e,except){
  const add=[];
  tr.clips=tr.clips.filter(c=>{
    if(c===except)return true;const ce=c.start+c.len;
    if(ce<=s+1e-9||c.start>=e-1e-9)return true;
    if(c.start>=s-1e-9&&ce<=e+1e-9)return false;
    if(c.start<s&&ce>e){const r=clone(c);r.id=nid();r.start=e;r.off=c.off+(e-c.start);r.len=ce-e;add.push(r);c.len=s-c.start;return true;}
    if(c.start<s){c.len=s-c.start;return true;}
    c.off+=e-c.start;c.len=ce-e;c.start=e;return true;
  });
  tr.clips.push(...add);
}
function split(tr,b){
  if(!tr)return;
  const c=tr.clips.find(c=>b>c.start+.01&&b<c.start+c.len-.01);
  if(!c){toast('Unter dem Strich liegt in dieser Spur kein Clip');return;}
  undoPush();const r=clone(c);r.id=nid();r.start=b;r.off=c.off+(b-c.start);r.len=c.start+c.len-b;c.len=b-c.start;
  tr.clips.push(r);flashIds.add(r.id);flashIds.add(c.id);renderProj();save();
}
function copyClip(o){
  clipboard={k:kindOf(o.tr),inst:o.tr.inst,tid:o.tr.id,c:clone(o.c)};
  o.el.classList.remove('flash');void o.el.offsetWidth;o.el.classList.add('flash');

}
function pasteAtLine(){
  if(!clipboard){toast('Zwischenablage leer – Clip doppelt antippen zum Kopieren');return;}
  let tr=selTr();
  if(kindOf(tr)!==clipboard.k){
    tr=P.tracks.find(t=>t.id===clipboard.tid&&kindOf(t)===clipboard.k)||P.tracks.find(t=>kindOf(t)===clipboard.k);
    if(!tr){const e=selTr();if(e.kind==='snd'&&!e.inst&&clipboard.k!=='fx'){undoPush();e.inst=clipboard.inst;wireDirty=true;tr=e;}else{toast('Keine passende Spur für diesen Clip');return;}}
  }
  undoPush();const c=clone(clipboard.c);c.id=nid();c.start=P.line;
  carve(tr,c.start,c.start+c.len);tr.clips.push(c);flashIds.add(c.id);
  P.line=c.start+c.len;P.sel=P.tracks.indexOf(tr);renderProj();ensureLineVisible();save();
}
function addClip(){
  const tr=selTr();if(!tr)return;
  if(tr.kind==='fx'){
    if(!tr.fx){openSlot(P.sel,addClip);return;}
    undoPush();const s=P.line,len=8,c={id:nid(),start:s,len,off:0,srcLen:len,pts:[{x:0,y:.5},{x:len,y:.5}]};
    carve(tr,s,s+len);tr.clips.push(c);flashIds.add(c.id);selClip=c.id;renderProj();save();return;
  }
  if(!tr.inst){openSlot(P.sel,addClip);return;}

function openSlot(i,after){

    e=>{if(e.target.closest('[data-del]'))removeTrack(i);},'narrow');return;
  }

      ${hostOf(i)?'':'<p class="note">Über dieser Effektspur liegt noch keine Tonspur.</p>'}

      <div class="prow"><span class="sp"></span>${delBtn}</div>`,
    e=>{

      if(t){if(tr.fx!==t.dataset.fx){undoPush();tr.fx=t.dataset.fx;wireDirty=true;ensureAudio();applyFxAt(P.line);renderProj();save();}const toEq=tr.fx==='eq'&&!after;finish();if(toEq)setTimeout(()=>openEq(i),170);return;}
      if(e.target.closest('[data-del]'))removeTrack(i);
    });
    return;
  }
  if(tr.inst==='audio'){
    showPanel(`<div class="ptitle">Aufnahme-Spur</div><div class="prow" style="margin-top:0"><span class="lab">Lautstärke</span><input type="range" min="0" max="1" step="0.01" value="${tr.vol}" data-vol><button class="pc${tr.mute?' on':''}" data-mute style="--c:#e9ebf0">Stumm</button></div>
      <p class="note">Aufnehmen: Kreis am roten Strich auf ＋ stellen und antippen. Liegt unter einer Vocoder-Spur, wird diese Aufnahme zur Vocoder-Stimme.</p><div class="prow"><span class="sp"></span>${delBtn}</div>`,
    (e,type)=>{
      if(type==='input'){if(e.target.matches('[data-vol]')){tr.vol=+e.target.value;ensureAudio();applyVol(tr);save();}return;}
      if(e.target.closest('[data-mute]')){tr.mute=!tr.mute;e.target.closest('[data-mute]').classList.toggle('on',tr.mute);applyVol(tr);renderProj();save();return;}
      if(e.target.closest('[data-del]'))removeTrack(i);
    },'narrow');return;
  }
  const insts=Object.keys(INST).filter(k=>k!=='audio').map(k=>`<button class="tile${tr.inst===k?' on':''}" data-inst="${k}" style="--c:${INST[k].c}"><b>${INST[k].n}</b><small>${INST[k].d}</small></button>`).join('');
  const more=tr.inst?`<div class="sub">Klang</div><div class="prs" style="--c:${INST[tr.inst].c}">${presets(tr).map((p,k)=>`<button class="pc${k===tr.preset?' on':''}" data-pre="${k}">${esc(p.n)}</button>`).join('')}</div>
    <div class="prow"><span class="lab">Lautstärke</span><input type="range" min="0" max="1" step="0.01" value="${tr.vol}" data-vol><button class="pc${tr.mute?' on':''}" data-mute style="--c:#e9ebf0">Stumm</button>${delBtn}</div>`
    :`<div class="prow"><span class="sp"></span>${delBtn}</div>`;
  showPanel(`<div class="ptitle">Instrument</div><div class="tiles">${insts}</div>${more}`,
  (e,type)=>{
    if(type==='input'){if(e.target.matches('[data-vol]')){tr.vol=+e.target.value;ensureAudio();applyVol(tr);save();}return;}
    const t=e.target.closest('[data-inst]');
    if(t){

        const was=kindOf(tr),will=k==='drum'?'drum':'syn';

        undoPush();if(was&&was!==will)tr.clips=[];

        ensureAudio();renderProj();save();
      }
      finish();return;
    }
    const p=e.target.closest('[data-pre]');
    if(p){tr.preset=+p.dataset.pre;renderProj();save();finish();return;}
    if(e.target.closest('[data-mute]')){tr.mute=!tr.mute;e.target.closest('[data-mute]').classList.toggle('on',tr.mute);applyVol(tr);renderProj();save();return;}
    if(e.target.closest('[data-del]'))removeTrack(i);
  });
}

function classify(e){
  const t=e.target;

  const sl=t.closest('.slot');if(sl)return {type:'slot',i:+sl.dataset.i};

  const ce=t.closest('.clip');
  if(ce){
    const o=clipEls.get(ce.dataset.cid);if(!o)return {type:'pan'};

    if(t.closest('.eL')||t.closest('.eR'))return {type:'trim',side:t.closest('.eL')?-1:1,o,s0:o.c.start,l0:o.c.len,f0:o.c.off};
    const r=ce.getBoundingClientRect(),lx=e.clientX-r.left,ly=e.clientY-r.top;

addEventListener('pointermove',e=>{

    case 'trim':doTrim(G.px);break;

function onUp(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);

  if(e.pointerId!==G.id)return;
  const g=G;G=null;clearTimeout(g.lp);lineDrag=false;
  if(e.type==='pointercancel'){if(g.type==='move'||g.type==='trim'||g.type==='tmove')renderProj();return;}
  switch(g.type){
    case 'pan':if(Math.abs(g.vx)+Math.abs(g.vy)>.05)inertia={vx:g.vx,vy:g.vy,t:performance.now()};break;
    case 'circle':if(!g.sw)execMode();break;
    case 'line':if(!g.moved){if(MODES[mode].k==='cut'&&g.row>=0)split(P.tracks[g.row],P.line);else if(g.row>=0)selectTrack(g.row);}else{applyFxAt(P.line);save();}break;
    case 'del':deleteClip(g.o);break;
    case 'trim':if(g.moved){carve(g.o.tr,g.o.c.start,g.o.c.start+g.o.c.len,g.o.c);renderProj();save();}break;
    case 'point':if(g.moved){drawClip(g.o);save();}else tapPoint(g);break;
    case 'move':endMove(g);break;

    }));
    if(!list.length)return;
    let ch=9;if(tr.inst!=='drum'){ch=Math.min(15,ci<9?ci:ci+1);ci++;}
    list.sort((a,b)=>a.t-b.t||a.o-b.o);
    const nm=str(INST[tr.inst].n+' – '+presetName(tr)),bytes=[0,0xFF,0x03,...vlq(nm.length),...nm];let last=0;
    list.forEach(e=>{bytes.push(...vlq(e.t-last),(e.o?0x90:0x80)|ch,e.n,e.v);last=e.t;});
    bytes.push(0,0xFF,0x2F,0);chunks.push(chunk('MTrk',bytes));
  });
  const n=chunks.length,all=[...chunk('MThd',[0,1,(n>>8)&255,n&255,(TPQ>>8)&255,TPQ&255]),...chunks.flat()];
  download(new Blob([new Uint8Array(all)],{type:'audio/midi'}),fname()+'.mid');toast('MIDI exportiert');
}

/* =====================================================================
   Tastatur (Desktop)
   ===================================================================== */
const KM='awsedftgyhujkolp',PKEYS='asdfghjkl';
addEventListener('keydown',e=>{
  if(e.repeat||$('#ov').classList.contains('show')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(screen==='proj'){
    if(e.code==='Space'){e.preventDefault();playing?stopT():playSong();}
    else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
    else if((e.key==='Delete'||e.key==='Backspace')&&selClip){const o=clipEls.get(selClip);if(o)deleteClip(o);}
  }else if(screen==='rec'){
    if(e.code==='Space'){e.preventDefault();R?finishRec():startRec();return;}
    const k=e.key.toLowerCase();
    if(recTr.inst==='drum'){const i=PKEYS.indexOf(k);if(i>=0&&recTr.pads[i]!=null)padHit(recTr.pads[i]);}
    else{const i=KM.indexOf(k);if(i>=0)noteOn('k'+k,12*(recTr.oct+1)+i);}
  }
});
addEventListener('keyup',e=>noteOff('k'+e.key.toLowerCase()));
addEventListener('pointerdown',()=>{if(P)ensureAudio();},{capture:true});

/* =====================================================================
   Anzeige-Schleife
   ===================================================================== */
function frame(){
  if(P&&screen==='proj'){
    const vw=lanesRect().width;
    if(playing&&!TO.rec){
      let b=Math.max(0,beatAt(ctx.currentTime));if(TO.loop&&b>TO.loop.e)b=TO.loop.e;P.line=lineVis=b;
      const x=b*P.ppb-sx;if(x>vw*.85||x<0)sxT=clamp(b*P.ppb-vw*.15,0,Math.max(0,contentW()-vw));
    }else if(!lineDrag){lineVis+=(P.line-lineVis)*.28;if(Math.abs(P.line-lineVis)<1e-3)lineVis=P.line;}
    if(inertia){const now=performance.now(),dt=now-inertia.t;inertia.t=now;sx-=inertia.vx*dt;sy-=inertia.vy*dt;const f=Math.pow(.93,dt/16);inertia.vx*=f;inertia.vy*=f;clampScroll();applyScroll();if(Math.abs(inertia.vx)+Math.abs(inertia.vy)<.02)inertia=null;}
    if(sxT!=null){sx+=(sxT-sx)*.18;if(Math.abs(sxT-sx)<.5){sx=sxT;sxT=null;}clampScroll();applyScroll();}
    if(G&&G.type==='tmove'){
      const r=lanesRect();let d=0;if(G.py>r.bottom-46)d=9;else if(G.py<r.top+22&&sy>0)d=-9;
      if(d){sy+=d;clampScroll();applyScroll();doTrackMove();}
    }
    if(G&&['line','move','trim','point'].includes(G.type)&&(G.moved||G.type==='move')){
      const r=lanesRect();let d=0;if(G.px>r.right-36)d=9;else if(G.px<r.left+28&&sx>0)d=-9;
      if(d){sx+=d;clampScroll();applyScroll();gestureMove();}
    }
    $('#line').style.transform=`translateX(${lineVis*P.ppb-sx+18}px)`;
  }else if(screen==='rec')recFrame();
  else if(screen==='mix')mixFrame();
  else if(screen==='arec')arFrame();
  requestAnimationFrame(frame);
}

/* =====================================================================
   Start
   ===================================================================== */
prefs=Object.assign(prefs,lsGet(PREF)||{});
migrate();
setMode(0);
requestAnimationFrame(frame);
</script>
